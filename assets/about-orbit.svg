 <text x="38" y="139" fill="#bdbdbd" font-family="Arial,sans-serif" font-size="17">Exploro información, construyo interfaces y conecto procesos.</text>
 <g transform="translate(38 178)"><rect width="350" height="215" rx="13" fill="#eeeeeb"/><text x="20" y="37" fill="#555" font-family="Consolas,monospace" font-size="12">01 / EXPLORAR</text><text x="20" y="82" fill="#111" font-family="Arial,sans-serif" font-size="26" font-weight="bold">DATOS</text><path d="M20 99H330" stroke="#aaa"/><text x="20" y="135" fill="#444" font-family="Arial,sans-serif" font-size="15">Exploración, limpieza</text><text x="20" y="157" fill="#444" font-family="Arial,sans-serif" font-size="15">y visualización de información.</text><text x="20" y="190" fill="#555" font-family="Consolas,monospace" font-size="12">PYTHON · POWER BI · SQL</text></g>
 <g transform="translate(425 178)"><rect width="350" height="215" rx="13" fill="#252525" stroke="#5a5a5a"/><text x="20" y="37" fill="#aaa" font-family="Consolas,monospace" font-size="12">02 / CONSTRUIR</text><text x="20" y="82" fill="#f4f4f2" font-family="Arial,sans-serif" font-size="26" font-weight="bold">FRONTEND</text><path d="M20 99H330" stroke="#555"/><text x="20" y="135" fill="#ccc" font-family="Arial,sans-serif" font-size="15">Interfaces, páginas y formularios</text><text x="20" y="157" fill="#ccc" font-family="Arial,sans-serif" font-size="15">pensados para las personas.</text><text x="20" y="190" fill="#aaa" font-family="Consolas,monospace" font-size="12">HTML · CSS · JAVASCRIPT</text></g>
 <g transform="translate(812 178)"><rect width="350" height="215" rx="13" fill="#151515" stroke="#5a5a5a"/><text x="20" y="37" fill="#aaa" font-family="Consolas,monospace" font-size="12">03 / CONECTAR</text><text x="20" y="82" fill="#f4f4f2" font-family="Arial,sans-serif" font-size="26" font-weight="bold">AUTOMATIZACIÓN</text><path d="M20 99H330" stroke="#555"/><text x="20" y="135" fill="#ccc" font-family="Arial,sans-serif" font-size="15">Explorando flujos y conexiones</text><text x="20" y="157" fill="#ccc" font-family="Arial,sans-serif" font-size="15">para simplificar tareas.</text><text x="20" y="190" fill="#aaa" font-family="Consolas,monospace" font-size="12">N8N · APIS · WEBHOOKS</text></g>
